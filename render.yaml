services:
  - type: worker
    name: tg-redeem-bot
    runtime: docker
    repo: https://github.com/bisug/TGReedemBot.git
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: python -m src
    autoDeploy: false
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: REQUIRED_CHANNEL_IDS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REFERRAL_REWARD_POINTS
        value: "1"
      - key: WITHDRAW_COST_POINTS
        value: "5"
      - key: SUPPORT_STARS_AMOUNT
        value: "10"

[project]
name = "redeem-code-bot"
version = "0.1.0"
description = "Modular Telegram referral points bot for redeem code withdrawals."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-telegram-bot==22.7",
    "SQLAlchemy==2.0.50",
    "asyncpg==0.31.0",
]

[project.scripts]
redeem-bot = "src.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
